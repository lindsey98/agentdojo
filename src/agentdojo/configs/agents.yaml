# Agent Configuration for AgentDojo
#
# Convention:
# - Agents are located in root-level agents/ directory
# - Each agent has a subdirectory: agents/baseline/, agents/isolategpt/, etc.
# - LangGraph agents must have a graph.py file exporting create_agent()
# - Pipeline agents must have a pipeline.py file exporting create_agent()

langgraph_agents:
  - baseline
  - baseline_random_suffix
  - llama_prompt_guard
  - llama_firewall
  - isolate_gpt

pipeline_agents:
  - camel
  - camel_secpol
  - camel_secpol_strict
  - progent

default_mode: pipeline
